[project]
name = "sprocket-robot"
version = "0.3.0"
description = "A general-purpose wheeled robot on the Arduino VENTUNO Q: a vision-language brain above a behavior-tree executive"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "httpx>=0.27.0"]

[project.optional-dependencies]
sim = ["mujoco>=3.3"]
eval = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
