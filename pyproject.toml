[project]
name = "sprocket-robot"
version = "0.3.0"
description = "Sprocket v2: a pet-like, helpful wheeled robot on the Arduino VENTUNO Q, with an agentic vision-language mind"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "httpx>=0.27.0"]

[project.optional-dependencies]
eval = ["opencv-python-headless>=4.9"]
vision = ["ultralytics>=8.4", "onnxruntime>=1.20", "onnx>=1.16"]  # YOLOE's text features and export
voice = ["faster-whisper>=1.0", "piper-tts>=1.2"]  # hearing and speaking (the demo)
dev = ["pytest>=8.0", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
per-file-target-version = { "robot/sim/habitat_server.py" = "py39" }  # runs in Habitat-Sim's Python 3.9

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
