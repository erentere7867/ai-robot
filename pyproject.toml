[project]
name = "sprocket-robot"
version = "0.2.0"
description = "Embodied AI robot harness for the Arduino VENTUNO Q: 360-degree vision, voice direction, real-time control"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "mujoco>=3.3",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.5"]
# Training and exporting the fast layer's detector (on the laptop); the robot runs the NCNN export.
perception = ["ultralytics>=8.3", "opencv-python-headless>=4.9"]
# The VENTUNO Q: MCU link (Arduino Router, msgpack-RPC), LD19 lidar (serial), detector (NCNN), microphones.
robot = ["pyserial>=3.5", "msgpack>=1.0", "ncnn", "sounddevice>=0.5"]
face = ["pygame-ce>=2.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pygame-ce>=2.5",
    "ruff>=0.11",
    "psutil>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robot*"]

[tool.setuptools.data-files]
"share/sprocket-robot/config" = ["config/robot.yaml", "config/robot.ventuno.yaml", "config/body.yaml", "config/SOUL.md", "config/companion_r1.xml", "config/companion_r1_physics.xml"]
"share/sprocket-robot/config/meshes" = ["config/meshes/*.stl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
# drain's public timeout API and startup-only path resolution are intentional.
ignore = ["ASYNC109", "ASYNC240"]
