robot_id: "companion_r1"
description: "Mobile 4-wheel skid-steer companion robot with tiltable head and 5-inch face display"

dimensions_mm:
  length: 282
  width: 228
  height: 355
  wheel_diameter: 120
  track_width: 208

drive:
  type: "skid_steer_4wd"
  max_linear_speed_mm_s: 400.0
  max_angular_speed_deg_s: 120.0

joints:
  head_tilt:
    type: "revolute"
    min_deg: -25.0
    max_deg: 35.0
    neutral_deg: 0.0
    max_speed_deg_s: 90.0

sensors:
  wheel_encoders:
    enabled: true
    ticks_per_rev: 720
  imu:
    enabled: true
    axes: ["yaw", "pitch", "roll", "accel_x", "accel_y", "accel_z"]
  front_tof:
    enabled: true
    min_stop_mm: 120.0
    default_reading_mm: 1500.0
  cliff:
    enabled: true
    sensors: ["front_left", "front_right", "rear_left", "rear_right"]
  # "Fovea + periphery": a detailed camera in the tilting head looks ahead (the detector's range, the VLM's
  # eye); two wide cameras on the sensor mast cover the rest, so the robot sees all around without turning.
  # Images are rectified to these pinhole models (robot/perception/geometry.py); the simulator builds its
  # cameras from this list. The VENTUNO Q takes three MIPI CSI cameras at once (device = CSI port).
  cameras:
    - name: front
      mount: head            # turns with the head tilt; position from the head pivot
      x_mm: 45.0
      z_mm: 88.0
      pitch_deg: -9.21
      hfov_deg: 90.0
      resolution: [640, 480]
      device: 0
    - name: rear_left
      mount: body            # sensor mast, under the lidar
      x_mm: -105.0
      y_mm: 14.0
      z_mm: 292.0
      yaw_deg: 115.0
      pitch_deg: 4.0
      hfov_deg: 140.0
      resolution: [640, 360]
      max_range_mm: 3000.0
      device: 1
    - name: rear_right
      mount: body
      x_mm: -105.0
      y_mm: -14.0
      z_mm: 292.0
      yaw_deg: -115.0
      pitch_deg: 4.0
      hfov_deg: 140.0
      resolution: [640, 360]
      max_range_mm: 3000.0
      device: 2
  lidar:
    enabled: true
    model: "LDROBOT LD19 (or LD06), 360 deg, 0.02-12 m, 10 Hz, USB-UART 230400 baud"
    x_offset_mm: -105.0
    z_height_mm: 330.0
  microphone_array:
    enabled: true
    model: "4-mic circular array, raw channels over USB (ReSpeaker / XVF3800 class): who spoke, and from where"
    # Mic positions on the head top (x forward, y left, mm, relative to the array centre); the array centre
    # sits above the head pivot. robot/audio/doa.py finds the voice's direction from the delays.
    center_x_mm: 25.0
    positions_mm: [[32.0, 0.0], [0.0, 32.0], [-32.0, 0.0], [0.0, -32.0]]

# Every emotion the face can show, and the sound that goes with it.
emotions:
  happy: happy_trill
  excited: happy_trill
  curious: curious_chirp
  sad: sad_whimper
  angry: angry_grumble
  grumpy: angry_grumble
  surprised: startle_pip
  sleepy: sleepy_yawn
  love: purr
  shy: giggle
  proud: happy_trill
  scared: startle_pip
  confused: soft_beep
  concerned: soft_beep
  neutral: none

# Short motions the Gesture behaviour plays: each step lasts `s` seconds at speed `v` (mm/s) and turn rate `w`
# (deg/s, + = left), with the head moved to `head` (degrees) if given.
gestures:
  nod:
    description: "Nod head up and down in agreement"
    steps: [{s: 0.3, head: 15}, {s: 0.3, head: 0}]
  shake:
    description: "Small left-right body shimmy to say no or show frustration"
    steps: [{s: 0.15, w: 100}, {s: 0.3, w: -100}, {s: 0.15, w: 100}, {s: 0.15, w: 100}, {s: 0.3, w: -100}, {s: 0.15, w: 100}]
  wiggle:
    description: "Playful in-place left-right wiggle"
    steps: [{s: 0.25, w: 90}, {s: 0.5, w: -90}, {s: 0.25, w: 90}, {s: 0.25, w: 90}, {s: 0.5, w: -90}, {s: 0.25, w: 90}]
  dance:
    description: "Happy spin-and-nod dance routine"
    steps: [{s: 0.6, w: 120, head: 18}, {s: 0.6, w: -120, head: 5}, {s: 0.3, v: 80}, {s: 0.3, v: -80}, {s: 0.6, w: 120, head: 5}]
  perk_up:
    description: "Perk head up attentively when greeted or excited"
    steps: [{s: 0.3, head: 14}]
  curious_tilt:
    description: "Tilt head up with a curious posture"
    steps: [{s: 0.35, head: 20}]
  sleepy_droop:
    description: "Droop head down gently when sleepy or sad"
    steps: [{s: 0.5, head: -18}]
  spin:
    description: "Full 360-degree playful spin in place"
    steps: [{s: 3.0, w: 120}]
  stomp:
    description: "Short forward-back stomp when angry or grumpy"
    steps: [{s: 0.25, v: 120}, {s: 0.25, v: -120}, {s: 0.25, v: 120}, {s: 0.25, v: -120}]
