# Raspberry Pi 5 (4 GB) on the real robot. See docs/raspberry_pi.md for setup.
#
# Fast layer: the trained detector (NCNN export) on every camera frame, 20 Hz control loop, motor
# reflexes on the microcontroller. Slow layer: LFM3-VL-2B Q4_K_M on the CPU. LFM3-VL-2B-QAD-Q4_0 runs
# faster on the Pi (Q4_0 is repacked for the Cortex-A76's dot-product instructions) but measured worse in
# the simulator (2026-11-01: decisions 71% vs 90%, core tasks 24/28 vs 28/28, several-part tasks 17/21 vs
# 20/21), so it is opt-in: swap the two model lines below. The F16 vision projector takes ~175 MB more RAM
# than Q8_0.
robot:
  name: "Sprocket"
  wake_words: ["sprocket", "hey sprocket", "robot", "hey robot"]
  follow_up_window_s: 8.0
  idle_sleepy_timeout_s: 45.0
  emotion_decay_rate_per_s: 0.08
runtime:
  runtime_dir: "~/robot-runtime"
  database_path: "~/robot-runtime/data/memory.db"
  recordings_dir: "~/robot-runtime/data/recordings"
  spatial_map_path: "~/robot-runtime/data/spatial_map.json"
  soul_path: "config/SOUL.md"
  body_config_path: "config/body.yaml"
  sim_tick_hz: 20.0
  face_fps: 30.0
  body_backend: "serial"          # firmware/base_controller on USB; "kinematic" to try it without hardware
  serial_port: "/dev/ttyACM0"
  camera: "picamera"              # or "usb"
bus:
  max_queue_size: 64
  record_events: false
agent:
  max_steps: 12
  max_actions: 160
  timeout_s: 600.0
autonomy:
  enabled: true
  idle_after_s: 30.0
  observation_interval_s: 2.0
  think_interval_s: 120.0
  drive_rate_scale: 1.0
perception:
  fast_detector: "auto"
  prefer_ncnn: true
  imgsz: 320
  confidence: 0.4
  loop_hz: 20.0
llm:
  backend: "auto"
  base_url: "http://127.0.0.1:8080"
  model_name: "LFM3-VL-2B-Q4_K_M"
  model_path: "~/robot-runtime/models/llm/LFM3-VL-2B-Q4_K_M.gguf"
  # model_name: "LFM3-VL-2B-QAD-Q4_0"     # faster, less accurate (see above)
  # model_path: "~/robot-runtime/models/llm/LFM3-VL-2B-QAD-Q4_0.gguf"
  mmproj_path: "~/robot-runtime/models/llm/mmproj-LFM3-VL-2B-F16.gguf"
  llama_server_bin: "~/robot-runtime/llama.cpp/build/bin/llama-server"
  gpu_layers: 0
  threads: 4
  ctx_size: 8192
  timeout_s: 240.0
  startup_timeout_s: 240.0
  temperature: 0.0
  max_tokens: 200
context_budget:
  total_tokens: 3584
  response_reserve_tokens: 256
  identity_tokens: 160
  memories_tokens: 120
  world_state_tokens: 220
  tools_tokens: 1100
  recent_turns_tokens: 320
  max_recent_turns: 4
