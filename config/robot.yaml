robot:
  name: "Sprocket"
  wake_words: ["sprocket", "hey sprocket", "robot", "hey robot"]
  follow_up_window_s: 8.0
  idle_sleepy_timeout_s: 45.0
  emotion_decay_rate_per_s: 0.08

runtime:
  runtime_dir: "~/robot-runtime"
  database_path: "~/robot-runtime/data/memory.db"
  recordings_dir: "~/robot-runtime/data/recordings"
  spatial_map_path: "~/robot-runtime/data/spatial_map.json"
  soul_path: "config/SOUL.md"
  body_config_path: "config/body.yaml"
  sim_tick_hz: 20.0
  # kinematic: perfect odometry, fast. physics: MuJoCo dynamics, wheel slip, odometry drift.
  body_backend: "kinematic"

bus:
  max_queue_size: 256
  record_events: true

agent:
  max_steps: 14        # model calls per request
  max_actions: 200
  timeout_s: 300.0

autonomy:
  enabled: true
  idle_after_s: 20.0          # quiet time after the human spoke before acting alone
  observation_interval_s: 1.0 # cheap checks (drives, camera thumbnail); no model calls
  think_interval_s: 45.0      # minimum gap between background decisions
  drive_rate_scale: 1.0       # >1 makes curiosity/social/play build up faster (demos)

llm:
  backend: "auto"
  base_url: "http://127.0.0.1:8080"
  model_name: "LFM3-VL-2B-Q4_K_M"
  model_path: "~/Downloads/LFM3-VL-2B-Q4_K_M.gguf"
  mmproj_path: "~/Downloads/mmproj-LFM3-VL-2B-Q8_0.gguf"
  llama_server_bin: "~/robot-runtime/llama.cpp/llama-server.exe"
  ctx_size: 8192
  timeout_s: 90.0
  temperature: 0.0
  max_tokens: 256
  thinking: false              # true lets the model reason first: slower, not more accurate here

context_budget:
  total_tokens: 4096
  response_reserve_tokens: 300
  identity_tokens: 200
  memories_tokens: 160
  world_state_tokens: 260
  tools_tokens: 1100
  recent_turns_tokens: 700
  max_recent_turns: 6
