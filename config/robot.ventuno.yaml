# The real robot on an Arduino VENTUNO Q (Qualcomm Dragonwing IQ8 + STM32H5). See docs/ventuno_q.md.
#
#   STM32H5 (firmware/ventuno_mcu)  200 Hz wheel loops, odometry, braking envelope, reflexes, watchdog
#   control thread                  50 Hz behaviours + collision monitor, SCHED_FIFO on a fast A78 core
#   perception thread               camera -> detector -> map, lidar -> map, on the other fast A78 core
#   llama-server (own process)      the two 2.1 GHz A78 cores (sprocket-llm.service)
#   everything else                 the four A55 cores
extends: robot.yaml

runtime:
  body_backend: "ventuno"        # the on-board STM32H5 through the Arduino Router (robot/hardware/ventuno_body.py)
  camera: "csi"                  # three MIPI cameras through the ISP (GStreamer); "usb" for USB cameras
  face_fps: 30.0

bus:
  max_queue_size: 128

perception:
  detector_gpu: true             # NCNN on the Adreno GPU through Vulkan: three cameras' worth of detections
  realtime_priority: 60          # needs LimitRTPRIO (set by scripts/ventuno/sprocket.service)
  tune_process: true             # GC freeze, 1 ms GIL switch, mlockall (LimitMEMLOCK=infinity)
  lidar: "/dev/lidar"            # LD19/LD06 through a udev symlink (scripts/ventuno/99-sprocket.rules)
  localization: true             # lidar scans matched to the map correct odometry drift

llm:
  auto_start_server: false       # sprocket-llm.service runs llama-server pinned to its own cores
  base_url: "http://127.0.0.1:8080"
  model_name: "LFM3-VL-2B-Q4_K_M"
  model_path: "~/robot-runtime/models/llm/LFM3-VL-2B-Q4_K_M.gguf"
  mmproj_path: "~/robot-runtime/models/llm/mmproj-LFM3-VL-2B-F16.gguf"
  llama_server_bin: "~/robot-runtime/llama.cpp/build/bin/llama-server"
  gpu_layers: 0
  threads: 2
  ctx_size: 8192
  timeout_s: 120.0
  startup_timeout_s: 180.0

autonomy:
  idle_after_s: 30.0
  think_interval_s: 90.0
